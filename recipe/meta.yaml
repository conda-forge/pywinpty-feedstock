{% set version = "3.1.2" %}

package:
  name: pywinpty
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pywinpty/pywinpty-{{ version }}.tar.gz
  sha256: 03e2d2abe7c0df64db354233c83479b2b43d9fdd1badceea994259ca3819b203

build:
  number: 0
  skip: true  # [not win or py<310]

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - clang
    - llvm
    - rust
    - llvmdev
    - llvm-tools
    - libclang
    - maturin >=1.1,<2.0
    - toml
    - pip
    - winpty
  host:
    - python
    - pip
    - winpty
  run:
    - python
    - winpty

test:
  imports:
    - winpty

about:
  home: https://github.com/spyder-ide/pywinpty
  license: MIT
  license_file:
    - LICENSE.txt
    - {{ RECIPE_DIR }}/library_licenses/
  summary: Pseudoterminals for Windows in Python
  description: |
    PyWinpty allows creating and communicating with Windows processes that
    receive input and print outputs via console input and output pipes.
    PyWinpty supports both the native ConPTY interface and the previous,
    fallback winpty library.
  doc_url: https://github.com/spyder-ide/pywinpty
  dev_url: https://github.com/spyder-ide/pywinpty

extra:
  recipe-maintainers:
    - davidbrochart
    - blink1073
    - ccordoba12
    - andfoy
    - ocefpaf
